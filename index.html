<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>读书笔记</title>
<style>
:root{--bg:#fdfcf9;--fg:#1f1f1f;--muted:#6b6b6b;--red:#c62828;--line:#e6e2d9;--card:#f5f2ea}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1b1b1d;--fg:#e8e6e1;--muted:#a3a09a;--red:#ff6b6b;--line:#3a3833;--card:#26252a}}
:root[data-theme="dark"]{--bg:#1b1b1d;--fg:#e8e6e1;--muted:#a3a09a;--red:#ff6b6b;--line:#3a3833;--card:#26252a}
body{background:var(--bg);color:var(--fg);font:16px/1.85 -apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;margin:0;padding:0 16px}
main{max-width:760px;margin:0 auto;padding:40px 0 80px}
h1{font-size:30px;margin:0 0 4px}h2{font-size:22px;margin:48px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line)}h3{font-size:17px;margin:28px 0 6px}
.sub{color:var(--muted);font-size:14px}
.legend{background:var(--card);border-radius:8px;padding:12px 16px;font-size:14px;margin:20px 0}
q.x{color:var(--red);quotes:"「" "」"}
q.x::before{content:open-quote}q.x::after{content:close-quote}
a.src{font-size:12px;color:var(--muted);margin-left:6px;text-decoration:none;border-bottom:1px dotted var(--muted);white-space:nowrap}
figure{margin:20px 0;background:var(--card);border-radius:8px;padding:12px}
figure svg{width:100%;height:auto;display:block}
figcaption{font-size:13px;color:var(--muted);margin-top:6px}
svg text{fill:var(--fg);font-size:13px}svg .m{fill:var(--muted);font-size:11px}
svg .ln{stroke:var(--fg);fill:none;stroke-width:1.6}svg .ax{stroke:var(--muted);stroke-width:1.2;fill:none}
svg .r{stroke:var(--red);fill:none;stroke-width:2}svg .box{fill:var(--bg);stroke:var(--fg);stroke-width:1.4}
table{border-collapse:collapse;width:100%;font-size:14px;margin:12px 0}td,th{border:1px solid var(--line);padding:6px 8px;text-align:center}
ul{padding-left:1.3em}li{margin:4px 0}
.note{border-left:3px solid var(--line);padding-left:12px;color:var(--muted);font-size:15px}
ul.books{list-style:none;padding:0}ul.books li{padding:12px 0;border-bottom:1px solid var(--line)}ul.books a{color:var(--fg);font-size:17px;text-decoration:none;font-weight:600}
</style>
</head>
<body><main>
<h1>读书笔记</h1>
<div class="sub">每本书（或一组相关的书）一份精华笔记。黑字是我的归纳，红字是原书摘录，并附原书链接。</div>

</main></body></html>
